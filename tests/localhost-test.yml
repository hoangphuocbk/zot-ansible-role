---
# =============================================================================
#  Role test on the machine calling ansible (test VM / CI runner).
#  Covers both binary sources and the important configuration branches:
#    Play 1: binary from a URL + htpasswd auth (community.general) + journald
#            + metrics + GC/dedupe
#    Play 2: binary copied from the controller + logging to file + logrotate
#            + pre-built htpasswd file + local checksum verification
#
#  Usage:
#    ansible-playbook -i tests/inventory tests/localhost-test.yml
#    ansible-playbook -i tests/inventory tests/localhost-test.yml --check --diff
#  Requirements: sudo access, Ubuntu 24.04.
# =============================================================================

- name: "Play 1 - install zot from a release URL (port 5001)"
  hosts: zot_test
  become: true
  gather_facts: true

  vars:
    zot_version: "2.1.21"
    zot_binary_variant: full
    zot_binary_source: url
    zot_verify_checksum: true

    zot_service_name: zot-test
    zot_http_address: "127.0.0.1" # no need to expose the test instance
    zot_http_port: 5001
    zot_http_realm: zot-test-url

    zot_config_dir: /etc/zot-test
    zot_data_dir: /var/lib/zot-test
    zot_log_dir: /var/log/zot-test
    zot_log_output: journald
    zot_log_level: info

    zot_auth_enabled: true
    zot_auth_fail_delay: 1
    zot_auth_users:
      - {name: admin, password: "testpass"}
      - {name: ci, password: "cipass"}
    zot_auth_purge_other_users: true

    zot_storage_dedupe: true
    zot_storage_gc: true
    zot_storage_gc_delay: "30m"
    zot_storage_gc_interval: "2h"

    zot_extensions_search: true
    zot_extensions_search_cve: false
    zot_extensions_ui: true
    zot_extensions_metrics: true
    zot_extensions_scrub: true

    zot_manage_sysctl: false
    zot_manage_firewall: false

    zot_health_check_retries: 20
    zot_health_check_delay: 3
    zot_show_summary: true

  roles:
    - role: zot

- name: "Play 2 - install zot from a local binary with file logging (port 5002)"
  hosts: zot_test
  become: true
  gather_facts: true

  vars:
    zot_version: "2.1.21"
    zot_binary_source: local
    zot_local_binary_path: /tmp/zot-test-local-binary

    zot_service_name: zot-test-local
    zot_http_address: "0.0.0.0"
    zot_http_port: 5002
    zot_http_realm: zot-test-local

    zot_config_dir: /etc/zot-test-local
    zot_data_dir: /var/lib/zot-test-local
    zot_log_dir: /var/log/zot-test-local
    zot_log_output: file
    zot_log_level: debug
    zot_manage_logrotate: true

    zot_auth_enabled: true
    zot_auth_htpasswd_local_file: /tmp/zot-test-htpasswd

    zot_extensions_search: true
    zot_extensions_ui: false
    zot_extensions_scrub: true

    zot_health_check_retries: 20
    zot_health_check_delay: 3
    zot_show_summary: true

  pre_tasks:
    - name: Create a copy of the binary on the controller to test the "local" source
      ansible.builtin.copy:
        src: /usr/local/bin/zot
        dest: /tmp/zot-test-local-binary
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Compute the sha256 of the copy (tests local checksum verification)
      ansible.builtin.command:
        cmd: sha256sum /tmp/zot-test-local-binary
      register: zot_test_local_sha
      changed_when: false

    - name: Pass the computed checksum to the role
      ansible.builtin.set_fact:
        zot_local_binary_checksum: "sha256:{{ (zot_test_local_sha.stdout).split()[0] }}"

    - name: Create a pre-built htpasswd file (user test / password testpass)
      ansible.builtin.copy:
        content: "test:$2b$10$PUZ2zFYH65Ypn3EAOVvTF.Xs5WA91vrYMfycEleqkwOcLbr2BrWrS\n"
        dest: /tmp/zot-test-htpasswd
        owner: root
        group: root
        mode: "0644"

  roles:
    - role: zot
