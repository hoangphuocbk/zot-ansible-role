---
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install "ansible-core>=2.16" ansible-lint yamllint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Playbook syntax check
        run: ansible-playbook -i inventory.ini install-zot.yml --syntax-check

  integration:
    name: Integration test on Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          pip install "ansible-core>=2.16"
          ansible-galaxy collection install -r requirements.yml

      - name: Install crane (registry client for the push/pull test, no daemon needed)
        run: |
          curl -sSL -o /tmp/crane.tgz \
            https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/crane.tgz -C /usr/local/bin crane

      - name: Apply role (run 1)
        run: ansible-playbook -i tests/inventory tests/localhost-test.yml

      - name: Both registries answer over HTTP
        run: |
          echo "-> play 1 (URL binary, htpasswd admin/testpass)"
          curl -fsS -u admin:testpass http://127.0.0.1:5001/v2/ | tee /dev/stderr
          echo "-> play 2 (local binary, file logging, htpasswd test/testpass)"
          curl -fsS -u test:testpass http://127.0.0.1:5002/v2/ | tee /dev/stderr

      - name: Push and pull an image through zot
        run: |
          crane auth login 127.0.0.1:5001 -u admin -p testpass --insecure
          crane copy --insecure alpine:3.20 127.0.0.1:5001/library/alpine:3.20
          crane ls --insecure 127.0.0.1:5001/library/alpine
          crane digest --insecure 127.0.0.1:5001/library/alpine:3.20

      - name: Check persisted data
        run: sudo find /var/lib/zot-test -maxdepth 3 -type d | head -20

      - name: Idempotence check (run 2 must report changed=0)
        run: |
          set -o pipefail
          ansible-playbook -i tests/inventory tests/localhost-test.yml | tee /tmp/second-run.log
          grep -E 'changed=0.*failed=0' /tmp/second-run.log
